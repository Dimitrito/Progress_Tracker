<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Tasks</h1>
      <p class="page-subtitle">
        Project #{{ projectId }} task board will be here.
      </p>
    </div>

    <a class="secondary-button" [routerLink]="['/app/projects', projectId]">
      Project settings
    </a>
  </header>

  <nav class="view-tabs" aria-label="Task views">
    <button type="button" class="view-tab view-tab-active">
      <span class="view-tab-icon">☰</span>
      <span>List</span>
    </button>

    <button type="button" class="view-tab" disabled>
      <span class="view-tab-icon">▦</span>
      <span>Board</span>
    </button>

    <button type="button" class="view-tab" disabled>
      <span class="view-tab-icon">▣</span>
      <span>Table</span>
    </button>

    <button type="button" class="view-tab" disabled>
      <span class="view-tab-icon">⚙</span>
      <span>Settings</span>
    </button>
  </nav>

  <div class="empty-state">
    <h2>No tasks yet</h2>
    <p>Task creation and project board UI will be added next.</p>
  </div>
</section>
