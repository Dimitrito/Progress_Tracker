<header class="topbar">
  <div class="topbar-copy">
    <p class="topbar-label">Selected organization</p>
    <h1 class="topbar-title">{{ organizationName() }}</h1>
  </div>

  <div class="topbar-actions">
    <div class="topbar-user-card">
      <span class="topbar-user-value">
        {{ authService.user()?.email ?? 'Loading profile...' }}
      </span>
    </div>

    <button type="button" class="topbar-logout" (click)="logout()">
      Logout
    </button>
  </div>
</header>
