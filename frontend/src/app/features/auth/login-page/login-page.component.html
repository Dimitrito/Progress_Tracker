<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Login</h1>
      <p class="auth-description">
        Sign in to access organizations, projects and team analytics.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="form-field">
        <span class="form-label">
          Email
          <span class="required-mark">*</span>
        </span>
        <input
          class="form-input"
          type="email"
          formControlName="email"
        />
      </label>

      <label class="form-field">
        <span class="form-label">
          Password
          <span class="required-mark">*</span>
        </span>

        <div class="password-field">
          <input
            class="form-input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [title]="showPassword() ? 'Hide password' : 'Show password'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3.75 3.75 20.25 20.25"
                />
                <path
                  d="M10.58 10.58A2 2 0 0 0 13.42 13.42"
                />
                <path
                  d="M9.2 5.42A8.9 8.9 0 0 1 12 5c5 0 8.25 4.25 9.25 7-0.38 1.05-1.1 2.24-2.1 3.34"
                />
                <path
                  d="M6.28 6.65C4.6 7.92 3.42 9.9 2.75 12c1 2.75 4.25 7 9.25 7 1.66 0 3.1-.47 4.32-1.2"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M2.75 12C3.75 9.25 7 5 12 5s8.25 4.25 9.25 7c-1 2.75-4.25 7-9.25 7s-8.25-4.25-9.25-7Z"
                />
                <path
                  d="M12 14.75A2.75 2.75 0 1 0 12 9.25a2.75 2.75 0 0 0 0 5.5Z"
                />
              </svg>
            }
          </button>
        </div>
      </label>

      @if (errorMessage()) {
        <p class="auth-error">{{ errorMessage() }}</p>
      }

      <button class="auth-submit" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-footer">
      No account yet?
      <a routerLink="/register" class="auth-link">Create one</a>
    </p>
  </div>
</section>
