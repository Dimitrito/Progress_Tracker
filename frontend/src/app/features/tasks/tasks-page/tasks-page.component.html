<section class="page">
  <header class="page-header">
    <div>
      <p class="page-kicker">Project workspace</p>

      <h1 class="page-title">
        {{ project()?.name || 'Project' }}
        <span class="page-title-muted">tasks</span>
      </h1>
    </div>
  </header>

  <nav class="view-tabs" aria-label="Task views">
    <button
      type="button"
      class="view-tab"
      [class.view-tab-active]="activeView() === 'board'"
      (click)="setActiveView('board')"
    >
      <span class="view-tab-icon">▦</span>
      <span>Board</span>
    </button>

    <button
      type="button"
      class="view-tab"
      [class.view-tab-active]="activeView() === 'list'"
      disabled
    >
      <span class="view-tab-icon">☰</span>
      <span>Project metrics</span>
    </button>

    <button
      type="button"
      class="view-tab"
      [class.view-tab-active]="activeView() === 'table'"
      disabled
    >
      <span class="view-tab-icon">▣</span>
      <span>Table</span>
    </button>

    <button
      type="button"
      class="view-tab"
      [class.view-tab-active]="activeView() === 'settings'"
      disabled
    >
      <span class="view-tab-icon">⚙</span>
      <span>Settings</span>
    </button>
  </nav>

  @if (activeView() === 'board') {
    <app-task-board [projectId]="projectId" />
  }
</section>
